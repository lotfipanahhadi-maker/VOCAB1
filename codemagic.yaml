workflows:
  vocab1_android:
    name: VOCAB1 Android Build
    instance_type: linux_x2
    environment:
      flutter: 3.44.8
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk